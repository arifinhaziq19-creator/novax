function renderTable(){const q=$('search').value.trim().toLowerCase();$('families').innerHTML=`<button data-family="" aria-pressed="${!family}">${t('Semua','All')}</button>`+Object.entries(categories).map(([k,v])=>`<button data-family="${k}" aria-pressed="${family===k}"><i class="dot" style="--c:${v[1]}"></i>${lang==='ms'?v[0]:k}</button>`).join('');$('ptable').innerHTML=Array.from({length:18},(_,i)=>`<span class="group-label" style="grid-column:${i+1};grid-row:1">${i+1}</span>`).join('')+elements.map(button).join('')+`<div class="fblock" style="grid-column:3;grid-row:7">57–71<br>↓</div><div class="fblock" style="grid-column:3;grid-row:8">89–103<br>↓</div><div class="fblock" style="grid-column:1 / 4;grid-row:10">${t('Lantanida','Lanthanides')}</div><div class="fblock" style="grid-column:1 / 4;grid-row:11">${t('Aktinida','Actinides')}</div>`;const matches=elements.filter(e=>(!family||e.category===family)&&(!q||[e.name,e.ms,e.symbol,String(e.z)].some(s=>s.toLowerCase().includes(q))));$('tableScroll').classList.toggle('hidden',!!q);$('results').classList.toggle('hidden',!q||!matches.length);$('results').innerHTML=q?matches.map(e=>button(e).replace(/grid-column:\d+;grid-row:\d+/,'')).join(''):'';$('empty').classList.toggle('hidden',!q||!!matches.length);$('tableTitle').textContent=q?`${matches.length} ${t('unsur ditemui','elements found')}`:`${family?matches.length:118} ${t('unsur · Tekan untuk teroka','elements · Tap to explore')}`}
function localize(){document.documentElement.lang=lang;document.querySelectorAll('[data-ms]').forEach(e=>e.textContent=lang==='ms'?e.dataset.ms:e.dataset.en);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));$('search').placeholder=t('Cari unsur, simbol atau nombor…','Search name, symbol or number…');$('home').href=$('brandHome').href='index.html?lang='+lang;canvas.setAttribute('aria-label',t('Model atom 3D. Seret atau guna kekunci anak panah untuk memutar.','3D atom model. Drag or use arrow keys to rotate.'));document.querySelectorAll('[data-open]').forEach(b=>{const e=elements[Number(b.dataset.open)-1];b.textContent=e.symbol+' · '+name(e)});renderTable();renderInfo();}
function renderInfo(){const e=elements[selected-1];$('symbol').textContent=e.symbol;$('atomName').textContent=name(e);$('subName').textContent=(lang==='ms'?e.name:e.ms)+' · '+t('Kala','Period')+' '+e.period;$('category').textContent=lang==='ms'?categories[e.category][0]:e.category;for(const k of ['atomicNumber','protons','electrons'])$(k).textContent=e.z;$('shells').innerHTML=e.shells.map((n,i)=>`<div class="shell"><small>${'KLMNOPQ'[i]} · n=${i+1}</small><b>${n}</b></div>`).join('');$('config').innerHTML=e.config.replace(/\s*\(predicted\)/i,'').replace(/([spdf])(\d+)/g,'$1<sup>$2</sup>');$('predicted').textContent=/predicted/i.test(e.config)?t('Konfigurasi ramalan bagi unsur ini.','Predicted configuration for this element.'):'';$('source').href='https://pubchem.ncbi.nlm.nih.gov/element/'+e.z;$('prev').disabled=selected===1;$('next').disabled=selected===118;$('play').textContent=paused?t('▶ Gerakkan','▶ Animate'):t('Ⅱ Jeda','Ⅱ Pause');$('play').setAttribute('aria-pressed',String(!paused));dirty=true;}
function openAtom(z){selected=Math.max(1,Math.min(118,Number(z)));yaw=.4;pitch=.35;setZoom(1);phase=0;renderInfo();if(!dialog.open)dialog.showModal();dialog.scrollTop=0;resize();}function resize(){const r=canvas.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);dirty=true}new ResizeObserver(resize).observe(canvas);
function project(x,y,z,w,h){const a=x*Math.cos(yaw)-z*Math.sin(yaw),b=x*Math.sin(yaw)+z*Math.cos(yaw),c=y*Math.cos(pitch)-b*Math.sin(pitch),d=y*Math.sin(pitch)+b*Math.cos(pitch),s=500/(500+d);return {x:w/2+a*s*zoom,y:h/2+c*s*zoom,z:d,s:s*zoom}}
function draw(){if(!ctx)return;const r=canvas.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);const e=elements[selected-1],max=Math.min(w,h)*.37,points=[];e.shells.forEach((n,i)=>{const radius=max*(.38+.62*(i+1)/e.shells.length),tilt=.18+i*.39;function pos(a){return project(radius*Math.cos(a),radius*Math.sin(a)*Math.cos(tilt),radius*Math.sin(a)*Math.sin(tilt),w,h)}ctx.beginPath();for(let j=0;j<=100;j++){const p=pos(j*Math.PI*2/100);if(j)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y)}ctx.strokeStyle='rgba(182,220,160,.28)';ctx.lineWidth=1;ctx.stroke();for(let j=0;j<n;j++){const p=pos(j*Math.PI*2/n+phase/(i+1)+i*.5);points.push({...p,type:'electron'})}});points.push({...project(0,0,0,w,h),type:'nucleus'});points.sort((a,b)=>b.z-a.z);for(const p of points){const nucleus=p.type==='nucleus',radius=(nucleus?22:3.2)*p.s;const glow=ctx.createRadialGradient(p.x-radius*.3,p.y-radius*.35,radius*.08,p.x,p.y,radius);glow.addColorStop(0,nucleus?'#efffc5':'#f2ffff');glow.addColorStop(.5,nucleus?'#b7d97c':'#bde9e8');glow.addColorStop(1,nucleus?'#517844':'#568887');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fill();if(nucleus){ctx.fillStyle='#152d19';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`600 ${14*p.s}px system-ui`;ctx.fillText(e.symbol,p.x,p.y)}}}
function frame(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(dialog.open&&!document.hidden){if(!paused){phase+=dt*.45;dirty=true}if(dirty){draw();dirty=false}}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function setZoom(v){zoom=Math.max(.55,Math.min(1.65,v));dirty=true;$('zoomOut').disabled=zoom<=.55;$('zoomIn').disabled=zoom>=1.65}const pointers=new Map();let pinch=0;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);pinch=0});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){const [a,b]=[...pointers.values()],distance=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)setZoom(zoom*distance/pinch);pinch=distance}else{yaw+=(e.clientX-old[0])*.008;pitch+=(e.clientY-old[1])*.008;dirty=true}});for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>{pointers.delete(e.pointerId);pinch=0});canvas.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')yaw-=.15;if(e.key==='ArrowRight')yaw+=.15;if(e.key==='ArrowUp')pitch-=.15;if(e.key==='ArrowDown')pitch+=.15;dirty=true}});canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.001))},{passive:false});$('play').onclick=()=>{paused=!paused;renderInfo()};$('reset').onclick=()=>{yaw=.4;pitch=.35;phase=0;setZoom(1)};$('zoomIn').onclick=()=>setZoom(zoom+.15);$('zoomOut').onclick=()=>setZoom(zoom-.15);$('close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{pointers.clear();pinch=0});$('prev').onclick=()=>openAtom(selected-1);$('next').onclick=()=>openAtom(selected+1);
document.addEventListener('click',e=>{const el=e.target.closest('[data-z],[data-open],[data-family],[data-lang]');if(!el)return;if(el.dataset.z||el.dataset.open){setZoom(1);openAtom(el.dataset.z||el.dataset.open)}else if(el.dataset.family!==undefined){family=el.dataset.family;renderTable()}else if(el.dataset.lang){lang=el.dataset.lang;try{localStorage.setItem('labhub-language',lang)}catch{}localize()}});$('search').addEventListener('input',renderTable);$('clear').onclick=()=>{$('search').value='';renderTable();$('search').focus()};localize();
</script></body></html>
